<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Starter composition — 6 seconds, one idea per scene.
         Keep reading text at 28 px or larger; label-like text carries data-layout-ignore. */
      :root {
        --bg: #0a0d12; --panel: #111722; --line: #242e3d;
        --text: #e7eef8; --muted: #9aa7ba; --accent: #5eead4;
        --font: "FilmMono", monospace;
      }
      @font-face {
        font-family: "FilmMono";
        src: url("assets/fonts/DejaVuSansMono.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "FilmMono";
        src: url("assets/fonts/JetBrainsMono-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
      #root { position: relative; width: 1920px; height: 1080px; }

      #eyebrow { position: absolute; left: 80px; top: 96px; font-size: 17px; letter-spacing: .26em; text-transform: uppercase; color: var(--accent); }
      #headline { position: absolute; left: 80px; top: 140px; font-size: 58px; font-weight: 700; letter-spacing: -.01em; }
      #subline { position: absolute; left: 80px; top: 236px; width: 1500px; font-size: 28px; line-height: 1.45; color: var(--muted); }

      #card { position: absolute; left: 80px; top: 400px; width: 520px; padding: 22px 24px;
              background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; }
      #card .tag { font-size: 17px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
      #card .n { font-size: 34px; font-weight: 700; margin-top: 6px; }
      #card .d { font-size: 28px; color: var(--muted); margin-top: 8px; line-height: 1.25; }

      #progress { position: absolute; left: 0; bottom: 0; height: 4px; width: 1920px; background: #151b25; }
      #progress i { display: block; height: 100%; width: 100%; background: var(--accent);
                    transform: scaleX(0); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">

      <div id="eyebrow" class="clip" data-layout-ignore data-start="0" data-duration="6" data-track-index="0">
        starter composition
      </div>
      <h1 id="headline" class="clip" data-start="0" data-duration="6" data-track-index="0">Headline goes here</h1>
      <div id="subline" class="clip" data-start="0" data-duration="6" data-track-index="0">
        One sentence that explains the frame. Replace it, keep it under two lines.
      </div>

      <div id="card" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="tag" data-layout-ignore>label</div>
        <div class="n">A single idea</div>
        <div class="d">Supporting detail, 28 px.</div>
      </div>

      <audio id="sound" class="clip" src="assets/soundtrack.m4a"
             data-start="0" data-duration="6" data-track-index="9" data-volume="0.5"></audio>

      <div id="progress" class="progress"><i id="bar"></i></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#headline", { y: 10 }, { y: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#subline", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.35);
      tl.fromTo("#card", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.2);
      tl.to("#bar", { scaleX: 1, duration: 6, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
