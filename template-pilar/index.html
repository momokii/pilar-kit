<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Kit · edisi 001 · Sumatera Barat / Rendang — 1080x1920, 30 fps, 22 s.
         Satu-satunya tempat token dan komponen baku. Scene hanya mengatur posisi. */
      :root {
        --krem: #F4EFE6; --tinta: #1B1714; --cabai: #C8402F; --kunyit: #E0A32E;
        --sans: "Inter", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --m: 96px; --col: 888px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--krem); }
      #root {
        position: relative; width: 1080px; height: 1920px;
        background: var(--krem); color: var(--tinta);
        font-family: var(--sans);
      }
      #root > [data-composition-id] { position: absolute; inset: 0; }

      /* --- komponen baku --- */
      .label {
        position: absolute; left: var(--m); top: 200px;
        font-family: var(--mono); font-size: 28px; font-weight: 500;
        letter-spacing: 0.08em; line-height: 1.3; text-transform: uppercase;
      }
      .label .sep { margin: 0 6px; }
      .dot {
        display: inline-block; width: 14px; height: 14px; margin: 0 12px;
        border-radius: 50%; background: var(--kunyit); vertical-align: 2px;
      }
      .hero {
        position: absolute; left: 88px;
        font-family: var(--sans); font-size: 150px; font-weight: 800;
        letter-spacing: -0.03em; line-height: 1; white-space: nowrap;
      }
      .hero .ch { display: inline-block; }
      .hero.wrap { white-space: normal; line-height: 1.04; }
      .hero.sm { font-size: 96px; letter-spacing: -0.02em; }
      .lead {
        position: absolute; left: var(--m); width: var(--col);
        font-family: var(--sans); font-size: 44px; font-weight: 600;
        letter-spacing: -0.01em; line-height: 1.15;
      }
      .rule {
        position: absolute; left: var(--m); width: 240px; height: 8px;
        background: var(--cabai); transform-origin: 0 50%;
      }
      .def {
        position: absolute; left: var(--m); width: var(--col);
        font-family: var(--mono); font-size: 38px; font-weight: 500;
        line-height: 1.35; letter-spacing: -0.01em;
      }
      .kv {
        font-family: var(--mono); font-size: 28px; font-weight: 400;
        line-height: 1.7; letter-spacing: 0.01em;
      }
      .kv .row { display: flex; gap: 24px; }
      .kv .k { width: 132px; }
      .track, .fill {
        position: absolute; left: var(--m); top: 1700px; width: var(--col); height: 3px;
      }
      .track { background: var(--tinta); opacity: 0.16; }
      .fill { background: var(--cabai); transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22"
         data-width="1080" data-height="1920" data-fps="30">

      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html"
           data-start="0" data-duration="22" data-track-index="2"
           data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
           data-start="0" data-duration="2.5" data-track-index="1"
           data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="peta" data-composition-id="peta" data-composition-src="compositions/peta.html"
           data-start="2.5" data-duration="2.5" data-track-index="1"
           data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="f1" data-composition-id="f1" data-composition-src="compositions/f1.html"
           data-start="5" data-duration="5" data-track-index="1"
           data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="f2" data-composition-id="f2" data-composition-src="compositions/f2.html"
           data-start="10" data-duration="5" data-track-index="1"
           data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="f3" data-composition-id="f3" data-composition-src="compositions/f3.html"
           data-start="15" data-duration="4.6" data-track-index="1"
           data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
           data-start="19.6" data-duration="2.4" data-track-index="1"
           data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="sound" class="clip" src="assets/soundtrack.m4a" data-start="0"
             data-duration="22" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
